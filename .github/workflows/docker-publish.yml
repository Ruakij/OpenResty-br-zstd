name: docker-publish

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
      - "nginx-v*"
  pull_request:
    paths:
      - "openresty/**"
      - "nginx/**"
      - "common/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to build and smoke-test instead of the caller ref
        type: string
        required: false
      flavors:
        description: JSON array of the flavors to build (openresty, nginx); empty builds both
        type: string
        required: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Generate build matrix
        id: config
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          FLAVORS: ${{ inputs.flavors }}
        run: |
          set -euo pipefail

          openresty="$(jq -r '.openresty' openresty/versions.json)"
          openresty_variants="$(jq -c '.variants // ["alpine-fat"]' openresty/versions.json)"
          nginx="$(jq -r '.nginx' nginx/versions.json)"
          nginx_variants="$(jq -c '.variants // ["alpine"]' nginx/versions.json)"

          if [ -z "${openresty}" ] || [ "${openresty}" = "null" ]; then
            echo "openresty/versions.json .openresty must be set."
            exit 1
          fi

          if [ "${openresty_variants}" = "null" ] || [ "${openresty_variants}" = "[]" ]; then
            echo "openresty/versions.json .variants must contain at least one entry."
            exit 1
          fi

          if [ -z "${nginx}" ] || [ "${nginx}" = "null" ]; then
            echo "nginx/versions.json .nginx must be set."
            exit 1
          fi

          if [ "${nginx_variants}" = "null" ] || [ "${nginx_variants}" = "[]" ]; then
            echo "nginx/versions.json .variants must contain at least one entry."
            exit 1
          fi

          # <nginx major.minor.patch>.<openresty patch>[-<image revision>]
          if ! [[ "${openresty}" =~ ^(([0-9]+\.[0-9]+)\.[0-9]+)\.[0-9]+(-[0-9]+)?$ ]]; then
            echo "openresty/versions.json .openresty has an unexpected format: ${openresty}"
            exit 1
          fi
          openresty_nginx="${BASH_REMATCH[1]}"
          openresty_nginx_minor="${BASH_REMATCH[2]}"

          if ! [[ "${nginx}" =~ ^([0-9]+\.[0-9]+)\.[0-9]+$ ]]; then
            echo "nginx/versions.json .nginx has an unexpected format: ${nginx}"
            exit 1
          fi
          nginx_minor="${BASH_REMATCH[1]}"

          # A release tag publishes the flavor it belongs to and must name the version
          # the flavor's versions.json holds at that commit; every other event builds the
          # flavors input, or both.
          flavors="${FLAVORS:-[\"openresty\",\"nginx\"]}"
          if ! jq -e 'type == "array" and length > 0 and all(.[]; . == "openresty" or . == "nginx")' <<<"${flavors}" >/dev/null; then
            echo "flavors must be a non-empty JSON array of openresty and nginx: ${flavors}"
            exit 1
          fi
          if [ "${REF_TYPE}" = "tag" ]; then
            case "${REF_NAME}" in
              nginx-v*)
                flavors='["nginx"]'
                expected="nginx-v${nginx}"
                ;;
              v*)
                flavors='["openresty"]'
                expected="v${openresty}"
                ;;
              *)
                echo "Release tag ${REF_NAME} matches neither v* nor nginx-v*."
                exit 1
                ;;
            esac
            if [ "${REF_NAME}" != "${expected}" ]; then
              echo "Release tag ${REF_NAME} does not match the version in versions.json (${expected})."
              exit 1
            fi
          fi

          matrix="$(jq -c \
            --argjson flavors "${flavors}" \
            --arg openresty "${openresty}" \
            --arg openresty_release "${openresty%-*}" \
            --arg openresty_nginx "${openresty_nginx}" \
            --arg openresty_nginx_minor "${openresty_nginx_minor}" \
            --argjson openresty_variants "${openresty_variants}" \
            --arg nginx "${nginx}" \
            --arg nginx_minor "${nginx_minor}" \
            --argjson nginx_variants "${nginx_variants}" \
            -n '
              def suffix($profile): if $profile == "standard" then "" else "-" + $profile end;

              def entry($flavor; $variant; $profile):
                {
                  openresty: {
                    image: "openresty-br-zstd",
                    file: "openresty/Dockerfile",
                    title: "OpenResty-br-zstd",
                    description: "OpenResty with Brotli and Zstd dynamic compression modules",
                    base: $openresty,
                    versions: [$openresty, $openresty_release, $openresty_nginx, $openresty_nginx_minor],
                    build_args: ["OPENRESTY_BASE_TAG=" + $openresty, "OPENRESTY_VARIANT=" + $variant]
                  },
                  nginx: {
                    image: "nginx-br-zstd",
                    file: "nginx/Dockerfile",
                    title: "nginx-br-zstd",
                    description: "nginx with Brotli and Zstd dynamic compression modules",
                    base: $nginx,
                    versions: [$nginx, $nginx_minor],
                    build_args: ["NGINX_VERSION=" + $nginx, "NGINX_VARIANT=" + $variant]
                  }
                }[$flavor] as $f
                | ($variant + suffix($profile)) as $floating
                | {
                    flavor: $flavor,
                    variant: $variant,
                    profile: $profile,
                    image: $f.image,
                    file: $f.file,
                    title: ($f.title + (if $profile == "standard" then "" else " (" + $profile + ")" end)),
                    description: ($f.description + ({
                      standard: "",
                      unprivileged: ", running as non-root user nginx (uid 101) on port 8080",
                      hardened: ", running as non-root user nginx (uid 101) on port 8080 without shell or package manager"
                    }[$profile])),
                    main: ($f.base + "-" + $floating),
                    build_args: ($f.build_args | join("\n")),
                    tags: (
                      ([$f.base + "-" + $floating]
                        + [$f.versions[] | . + "-" + $floating]
                        + [$floating]
                        + (if $variant == "alpine" and $profile != "standard" then [$profile] else [] end)
                        + (if $variant == "alpine" and $profile == "standard" then ["latest"] else [] end))
                      | reduce .[] as $tag ([]; if any(.[]; . == $tag) then . else . + [$tag] end)
                      | map("type=raw,value=" + .) | join("\n"))
                  };

              [
                $flavors[] as $flavor
                | ({openresty: $openresty_variants, nginx: $nginx_variants}[$flavor])[] as $variant
                | ["standard", "unprivileged", "hardened"][] as $profile
                | select($profile != "hardened" or ($variant | startswith("alpine")))
                | entry($flavor; $variant; $profile)
              ]')"

          if [ "${matrix}" = "[]" ]; then
            echo "The build matrix is empty."
            exit 1
          fi

          echo "${matrix}" | jq .
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.image }} ${{ matrix.variant }} ${{ matrix.profile }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve built commit
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute lowercase image name
        id: image
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          image_name="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            ${{ matrix.tags }}
            type=raw,value=${{ matrix.main }}--rev-${{ steps.commit.outputs.short }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.file }}
          target: ${{ matrix.profile }}
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: |
            ${{ matrix.build_args }}
            VERSION=${{ matrix.main }}
            REVISION=${{ steps.commit.outputs.sha }}
            CREATED=${{ steps.timestamp.outputs.created }}
          push: ${{ github.ref_type == 'tag' }}
          load: ${{ github.ref_type != 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.flavor }}-${{ matrix.variant }}-${{ matrix.profile }}
          cache-to: type=gha,mode=max,scope=${{ matrix.flavor }}-${{ matrix.variant }}-${{ matrix.profile }}

      - name: Validate nginx configuration
        if: github.ref_type != 'tag'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ matrix.main }}
        run: bash common/smoke-test.sh config "${IMAGE}" "${{ matrix.flavor }}" "${{ matrix.profile }}"

      - name: Start and validate container
        if: github.ref_type != 'tag'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ matrix.main }}
        run: bash common/smoke-test.sh start "${IMAGE}" "${{ matrix.flavor }}" "${{ matrix.profile }}"
