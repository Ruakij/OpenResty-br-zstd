name: docker-publish

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "Dockerfile"
      - "container/**"
      - "versions.json"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      openresty: ${{ steps.config.outputs.openresty }}
      variants: ${{ steps.config.outputs.variants }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read configured OpenResty tags
        id: config
        run: |
          set -euo pipefail

          openresty="$(jq -r '.openresty' versions.json)"
          variants="$(jq -c '.variants // ["alpine-fat"]' versions.json)"

          if [ -z "${openresty}" ] || [ "${openresty}" = "null" ]; then
            echo "versions.json .openresty must be set."
            exit 1
          fi

          if [ "${variants}" = "null" ] || [ "${variants}" = "[]" ]; then
            echo "versions.json .variants must contain at least one entry."
            exit 1
          fi

          echo "openresty=${openresty}" >> "$GITHUB_OUTPUT"
          echo "variants=${variants}" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.prepare.outputs.variants) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute git describe
        id: describe
        run: echo "sha=$(git describe --tags --always --long)" >> "$GITHUB_OUTPUT"

      - name: Compute build timestamp
        id: timestamp
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute lowercase image name
        id: image
        run: |
          image_name="$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${image_name}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.openresty }}-${{ matrix.variant }}
            type=raw,value=${{ needs.prepare.outputs.openresty }}-${{ matrix.variant }}--rev-${{ steps.describe.outputs.sha }}
            type=raw,value=${{ matrix.variant }},enable=${{ github.ref_name == github.event.repository.default_branch }}
            type=raw,value=latest,enable=${{ github.ref_name == github.event.repository.default_branch && matrix.variant == 'alpine' }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.ref_type == 'tag' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          build-args: |
            OPENRESTY_BASE_TAG=${{ needs.prepare.outputs.openresty }}
            OPENRESTY_VARIANT=${{ matrix.variant }}
            VERSION=${{ needs.prepare.outputs.openresty }}-${{ matrix.variant }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.timestamp.outputs.created }}
          push: ${{ github.ref_type == 'tag' }}
          load: ${{ github.ref_type != 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate OpenResty configuration
        if: github.ref_type != 'tag'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.openresty }}-${{ matrix.variant }}
        run: |
          set -euo pipefail

          docker run --rm "${IMAGE}" openresty -t

      - name: Start and validate container
        if: github.ref_type != 'tag'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.openresty }}-${{ matrix.variant }}
          CONTAINER: openresty-br-zstd-smoke-${{ matrix.variant }}
        run: |
          set -Eeuo pipefail

          cleanup() {
            exit_code=$?
            if [ "${exit_code}" -ne 0 ] && docker container inspect "${CONTAINER}" >/dev/null 2>&1; then
              echo "Container logs:"
              docker logs "${CONTAINER}" || true
              echo "Container state:"
              docker inspect --format '{{json .State}}' "${CONTAINER}" || true
            fi
            docker rm --force "${CONTAINER}" >/dev/null 2>&1 || true
            exit "${exit_code}"
          }
          trap cleanup EXIT

          docker run --detach \
            --name "${CONTAINER}" \
            "${IMAGE}" >/dev/null

          sleep 2
          state="$(docker inspect --format '{{.State.Status}}' "${CONTAINER}")"
          if [ "${state}" != "running" ]; then
            echo "Container is not running: ${state}"
            exit 1
          fi

          logs="$(docker logs "${CONTAINER}" 2>&1)"
          printf '%s\n' "${logs}"
          if printf '%s\n' "${logs}" | grep -Eiq '\[(warn|error|crit|alert|emerg)\]'; then
            echo "Nginx warning or error severity found in container logs."
            exit 1
          fi
