name: upstream-sync

# Events caused by GITHUB_TOKEN (opened PR, merge push, tag push) start no other
# workflows, so this workflow tests, merges and releases the bump itself.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync-openresty-version
  cancel-in-progress: false

permissions: {}

jobs:
  sync-openresty-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
      pr-number: ${{ steps.pr.outputs.pull-request-number }}
      pr-head-sha: ${{ steps.pr.outputs.pull-request-head-sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve latest upstream OpenResty version
        id: detect
        env:
          TAG_REGEX: "^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9]+)?-alpine-fat$"
        run: |
          set -euo pipefail

          tags=$(
            for page in 1 2 3; do
              curl -fsSL "https://hub.docker.com/v2/repositories/openresty/openresty/tags?page_size=100&page=${page}" \
                | jq -r '.results[].name'
            done
          )

          latest="$(printf '%s\n' "${tags}" | grep -E "${TAG_REGEX}" | sed 's/-alpine-fat$//' | sort -V | tail -n1)"

          if [ -z "${latest}" ]; then
            echo "Could not resolve latest matching OpenResty tag."
            exit 1
          fi

          current="$(jq -r '.openresty' versions.json)"

          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"

          if [ "${current}" = "${latest}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update tracked version files
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail

          latest="${{ steps.detect.outputs.latest }}"

          jq --arg v "${latest}" '.openresty = $v' versions.json > versions.json.tmp
          mv versions.json.tmp versions.json

          sed -i -E "s/^ARG OPENRESTY_BASE_TAG=.*/ARG OPENRESTY_BASE_TAG=${latest}/" Dockerfile

      - name: Create pull request for version bump
        id: pr
        if: steps.detect.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.OPENRESTY_SYNC_PR_TOKEN != '' && secrets.OPENRESTY_SYNC_PR_TOKEN || github.token }}
          branch: automation/openresty-version-sync
          delete-branch: true
          commit-message: "chore: bump OpenResty to ${{ steps.detect.outputs.latest }}"
          title: "chore: bump OpenResty to ${{ steps.detect.outputs.latest }}"
          body: |
            Automated OpenResty upstream sync.

            - Previous: `${{ steps.detect.outputs.current }}`
            - New: `${{ steps.detect.outputs.latest }}`

            This PR updates:
            - `versions.json`
            - `Dockerfile` (`ARG OPENRESTY_BASE_TAG`)

            The upstream-sync workflow smoke-tests this PR, squash-merges it once all
            checks pass and releases `v${{ steps.detect.outputs.latest }}`.

  test:
    needs: sync-openresty-version
    if: needs.sync-openresty-version.outputs.pr-head-sha != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: ${{ needs.sync-openresty-version.outputs.pr-head-sha }}

  merge:
    needs: [sync-openresty-version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ needs.sync-openresty-version.outputs.pr-number }}
      HEAD_SHA: ${{ needs.sync-openresty-version.outputs.pr-head-sha }}
    steps:
      - name: Wait for pull request checks
        run: gh pr checks "${PR}" --watch --interval 30

      - name: Merge pull request
        run: gh pr merge "${PR}" --squash --match-head-commit "${HEAD_SHA}"

  # Releases the version on main whenever its tag is missing, so a bump merged
  # by hand gets released by the next run as well.
  release:
    needs: [sync-openresty-version, merge]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Create release and publish images
        run: |
          set -euo pipefail

          tag="v$(jq -r '.openresty' versions.json)"

          if gh release view "${tag}" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists."
            exit 0
          fi

          gh release create "${tag}" --target "$(git rev-parse HEAD)" --title "${tag}" --generate-notes
          gh workflow run docker-publish.yml --ref "${tag}"
