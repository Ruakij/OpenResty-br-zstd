proxy_hide_header   X-Powered-By;
proxy_hide_header   X-AspNet-Version;
proxy_hide_header   X-AspNetMvc-Version;
fastcgi_hide_header X-Powered-By;
fastcgi_hide_header X-AspNet-Version;
fastcgi_hide_header X-AspNetMvc-Version;
uwsgi_hide_header   X-Powered-By;
uwsgi_hide_header   X-AspNet-Version;
uwsgi_hide_header   X-AspNetMvc-Version;
scgi_hide_header    X-Powered-By;
scgi_hide_header    X-AspNet-Version;
scgi_hide_header    X-AspNetMvc-Version;

# A header the upstream sends wins: add_header skips empty values, and appending a
# second Referrer-Policy would replace a stricter upstream policy in the browser.
map $upstream_http_x_content_type_options $hardened_x_content_type_options {
    ""      "nosniff";
    default "";
}
map $upstream_http_x_frame_options $hardened_x_frame_options {
    ""      "SAMEORIGIN";
    default "";
}
map $upstream_http_referrer_policy $hardened_referrer_policy {
    ""      "strict-origin-when-cross-origin";
    default "";
}
map $upstream_http_x_permitted_cross_domain_policies $hardened_x_permitted_cross_domain_policies {
    ""      "none";
    default "";
}

# merge keeps these headers where a server or location sets its own add_header.
add_header_inherit merge;
add_header X-Content-Type-Options            $hardened_x_content_type_options always;
add_header X-Frame-Options                   $hardened_x_frame_options always;
add_header Referrer-Policy                   $hardened_referrer_policy always;
add_header X-Permitted-Cross-Domain-Policies $hardened_x_permitted_cross_domain_policies always;
